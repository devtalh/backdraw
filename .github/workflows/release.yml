# Publishes a release when a version tag (v2.1.1, …) is pushed:
#   1. test on Windows, and check that the tag matches package.json
#   2. npm, with trusted publishing (OIDC; provenance is added by npm, no token is stored)
#   3. the official MCP Registry, with mcp-publisher and GitHub OIDC
# Each publish step is skipped when that version is already out, so a re-run is safe.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Tag matches the package version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm test

  npm:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: npm 11.5.1 or later (needed for trusted publishing)
        run: npm install -g npm@latest && npm --version
      - name: Publish to npm
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "backdraw@$version" version > /dev/null 2>&1; then
            echo "backdraw@$version is already on npm"
          else
            npm publish
          fi

  mcp-registry:
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # mcp-publisher login github-oidc
    env:
      MCP_PUBLISHER_VERSION: v1.8.4
    steps:
      - uses: actions/checkout@v6
      - name: Wait until npm serves this version with mcpName
        run: |
          version="$(node -p "require('./package.json').version")"
          for i in $(seq 1 45); do
            name="$(npm view "backdraw@$version" mcpName 2>/dev/null || true)"
            if [ "$name" = "io.github.devtalh/backdraw" ]; then echo "npm has backdraw@$version"; exit 0; fi
            sleep 20
          done
          echo "::error::npm did not serve backdraw@$version with mcpName in time"
          exit 1
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: Publish to the MCP Registry
        run: |
          version="$(node -p "require('./server.json').version")"
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "https://registry.modelcontextprotocol.io/v0.1/servers/io.github.devtalh%2Fbackdraw/versions/$version")"
          if [ "$status" = "200" ]; then
            echo "io.github.devtalh/backdraw $version is already in the MCP Registry"
          else
            ./mcp-publisher login github-oidc
            ./mcp-publisher publish
          fi
