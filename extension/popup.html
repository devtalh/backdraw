<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Backdraw</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="popup.css">
  <script src="i18n.js"></script>
  <script src="settings.js"></script>
</head>
<body>
  <header>
    <img class="mascot" src="icons/mascot-96.png" srcset="icons/mascot-96.png 1x, icons/mascot-192.png 2x" width="36" height="36" alt="">
    <div class="brand"><b>Backdraw</b><small><span data-i18n="version">Version</span> <span id="ver">?</span></small></div>
    <button id="settingsBtn" class="icon" aria-expanded="false" aria-controls="settings" data-i18n-title="settings">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M4 6h9M19 6h1M4 12h3M13 12h7M4 18h11M21 18h-1"/><circle cx="16" cy="6" r="2.2"/><circle cx="10" cy="12" r="2.2"/><circle cx="18" cy="18" r="2.2"/>
      </svg>
    </button>
  </header>
  <section id="settings" class="settings" hidden>
    <label><span data-i18n="language">Language</span>
      <select id="language">
        <option value="auto" data-i18n="optAuto">Auto</option><option value="en" data-i18n="langEnglish">English</option><option value="tr" data-i18n="langTurkish">Türkçe</option>
      </select>
    </label>
    <label><span data-i18n="theme">Theme</span>
      <select id="theme">
        <option value="auto" data-i18n="optAuto">Auto</option><option value="light" data-i18n="themeLight">Light</option><option value="dark" data-i18n="themeDark">Dark</option>
      </select>
    </label>
    <label class="cleanup-wide"><span data-i18n="cleanupSetting">After a job: ChatGPT chat</span>
      <select id="chatCleanup" aria-describedby="cleanupHint">
        <option value="keep" data-i18n="cleanupKeep">Keep</option>
        <option value="archive" data-i18n="cleanupArchive">Archive</option>
        <option value="delete" data-i18n="delete">Delete</option>
      </select>
    </label>
    <small id="cleanupHint" class="note cleanup-wide"></small>
    <div id="cleanupSettingConfirm" class="cleanup-confirm cleanup-wide" hidden></div>
    <button id="cleanupNow" class="btn cleanup-wide" data-i18n="cleanupNow">Clean up now</button>
    <div id="cleanupView" class="cleanup-wide" role="status" aria-live="polite" hidden></div>
  </section>
  <section id="wizard" hidden>
    <h2><span data-i18n="setupTitle">Set up Backdraw</span><small id="setupCount"></small></h2>
    <ol id="steps" class="steps"></ol>
  </section>
  <section id="overview" hidden>
    <dl class="rows">
      <dt data-i18n="bridge">Bridge</dt><dd id="conn">…</dd>
      <dt data-i18n="chatgpt">ChatGPT</dt><dd id="chat">…</dd>
      <dt data-i18n="project">Project</dt><dd id="project">…</dd>
      <dt data-i18n="job">Job</dt><dd id="job">…</dd>
    </dl>
    <button id="pick" class="btn primary" hidden></button>
    <details id="checklist"><summary data-i18n="setupChecklist">Setup</summary><ol id="doneSteps" class="steps"></ol></details>
  </section>
  <section id="collections" hidden>
    <h2 data-i18n="collections">Collections</h2>
    <div id="colList"></div>
    <div id="colDetail" hidden>
      <div id="colHead"><button id="colBack" class="btn" data-i18n="back">‹ Back</button><span id="colName"></span></div>
      <div id="colPath"></div>
      <div class="actions"><button id="colRename" class="btn" data-i18n="rename">Rename</button><button id="colDelete" class="btn danger" data-i18n="deleteCollection">Delete collection</button></div>
      <div id="colEdit" hidden></div>
      <div id="colGrid"></div>
    </div>
    <p id="colMsg"></p>
  </section>
  <footer><span data-i18n="footerNote">Images are made in a background tab; your active tab does not change.</span><button id="gallery" class="link" hidden data-i18n="openGallery">Open gallery</button></footer>
  <script src="setup.js"></script>
  <script src="chat-cleanup-ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
